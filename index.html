<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Goal-Action APP 安定版 v2</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--line:#e5e7eb;--text:#111827;--muted:#6b7280;--blue:#2563eb;--green:#059669;--gray:#374151;--amber:#d97706}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Meiryo UI","Yu Gothic UI",sans-serif}
.wrap{max-width:1200px;margin:0 auto;padding:20px}
.grid{display:grid;gap:16px}
.grid2{grid-template-columns:1.1fr .9fr}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 4px 12px rgba(0,0,0,.04)}
h1{margin:0 0 8px;font-size:24px}
h2{margin:0 0 12px;font-size:18px}
.sub{color:var(--muted);margin-bottom:14px}
.status{padding:12px;border-radius:12px;background:#eff6ff;border:1px solid #bfdbfe;color:#1d4ed8;margin-bottom:16px}
.kv{display:grid;grid-template-columns:180px 1fr;gap:8px;font-size:14px}
.kv div:nth-child(odd){color:var(--muted)}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
input[type=text],textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;background:#fff}
textarea{min-height:120px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:10px;padding:10px 14px;cursor:pointer;color:#fff;font-weight:600}
.btn.blue{background:var(--blue)}
.btn.green{background:var(--green)}
.btn.gray{background:var(--gray)}
.btn.light{background:#e5e7eb;color:#111827}
.btn.amber{background:var(--amber)}
.list{border:1px solid var(--line);border-radius:12px;max-height:320px;overflow:auto}
.item{padding:12px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.small{font-size:12px;color:var(--muted)}
.mono{font-family:Consolas,Monaco,monospace}
.pill{display:inline-block;background:#eef2ff;color:#3730a3;border-radius:999px;padding:2px 8px;font-size:12px}
.warn{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;border-radius:12px;padding:12px;font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Goal-Action APP 安定版（復旧優先）v2</h1>
  <div class="sub">壊れた同期画面を回避し、<span class="mono">goal-action-kohei-2026</span> を安全に扱うための安定版です。</div>
  <div id="status" class="status">初期化中...</div>

  <div class="grid grid2">
    <div class="grid">
      <div class="card">
        <h2>ローカル状態</h2>
        <div id="localSummary" class="kv"></div>
        <div class="row" style="margin-top:12px">
          <button id="btnReload" class="btn light">ローカル再読込</button>
          <button id="btnSaveLocal" class="btn green">ローカル保存</button>
          <button id="btnExport" class="btn gray">JSONエクスポート</button>
